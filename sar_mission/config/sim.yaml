# Parameters for Gazebo (WSL2 Ubuntu 22.04, ROS 2 Humble, TurtleBot3 waffle).
# The TurtleBot3's lidar stands in for the depth pseudo-scan, fake_detector for YOLO, and
# steering_wrapper makes the TurtleBot drive like the RC car.

/**:
  ros__parameters:
    use_sim_time: true
    arena_size: 20.0
    search_min: 5.0
    search_max: 15.0
    start_corner: "SW"
    start_heading: "edge"
    start_inset: 1.5
    odom_frame: "odom"
    odom_topic: "/odom"
    scan_topic: "/scan"
    turn_radius: 1.65           # keep equal in local_driver and steering_wrapper
    steering_mode: "three_value"

path_planner:
  ros__parameters:
    inflation: 0.4

local_driver:
  ros__parameters:
    cmd_topic: "/car/cmd_vel"   # steering_wrapper turns this into TurtleBot /cmd_vel
    reverse_allowed: false
    use_fence: true

steering_wrapper:
  ros__parameters:
    sim_slow_speed: 0.35
    car_can_reverse: false

mission_manager:
  ros__parameters:
    n_lanes: 3
    gate_layout: "corners"
    gate_colours: ["red", "blue", "green", "yellow"]
    start_on: "motion"

target_tracker:
  ros__parameters:
    use_depth: false
    csv_path: "~/sar_targets_sim.csv"

exit_detector:
  ros__parameters:
    use_camera: false           # colours come from fake_detector

fake_detector:
  ros__parameters:
    detect_range: 5.0
    classify_range: 2.2
    confusion: 0.15
