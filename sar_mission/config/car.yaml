# Parameters for the REAL car (Jetson, ROS 2 Foxy, ZED2).
# Every number marked MEASURE comes from the day-1 tests (Phase 1 PDF, assumptions A8-A11);
# change it here, not in the code.

/**:
  ros__parameters:
    # ---- arena (scoring sheet 27 Nov: ~10 x 7 m, walls, 1.5 x 1.5 m corner zones) ----
    # arena frame: origin SW corner, x east along the 10 m wall, y north. If the court is the other
    # way round on the day, keep x along the LONG wall and pick the start corner to match.
    arena_size: [10.0, 7.0]     # MEASURE on the day (x = long side)
    zone_size: 1.5
    start_corner: "SW"          # SW / SE / NE / NW: set per run (start_corner:=... on the launch line)
    start_heading: "edge"       # along the long wall, into the arena; or "diagonal", or degrees (the
                                # judges give the heading: TA question)
    start_inset: 0.75           # car at the centre of the 1.5 x 1.5 m start zone
    # ---- topics / frames ----
    odom_frame: "odom"          # known-map mode: car.launch.py switches these to sar_map, /sar/odom
    odom_topic: "/zed/zed_node/odom"
    scan_topic: "/sar/scan"
    # ---- known-map mode (set on the launch line: prior_map:=... course_file:=...) ----
    prior_map: ""               # saved course map .yaml (ZED save_map, ply_to_map or compare_maps --merged)
    course_file: ""             # course_measurements.yaml: measured start marks and exits

depth_scan:
  ros__parameters:
    depth_topic: "/zed/zed_node/depth/depth_registered"
    camera_info_topic: "/zed/zed_node/depth/camera_info"
    scan_frame: "zed_left_camera_frame"
    camera_height: 0.25         # MEASURE: lens centre above the floor
    pixel_step: 4
    min_height: 0.03            # obstacle threshold above the fitted floor, + 1 cm per metre
    min_height_per_m: 0.01
    max_height: 0.8
    unknown_fraction: 0.4       # >40% missing depth close in front -> treat as blocked
    unknown_range: 1.2
    max_rate: 10.0

path_planner:
  ros__parameters:
    inflation: 0.3              # car half-width + margin (0.4 in the 20 m arena)
    replan_period: 1.0
    sensor_offset: 0.2          # fallback if TF odom -> scan frame is missing

local_driver:
  ros__parameters:
    cmd_topic: "/cmd_vel"
    steering_mode: "three_value"   # MEASURE: "proportional" if the servo turns in proportion to angular.z
    turn_radius: 1.65              # MEASURE: full-lock turn radius at slow speed
    turn_radius_left: 0.0          # MEASURE if left/right differ (0 = use turn_radius)
    turn_radius_right: 0.0
    radius_spread: 0.25            # wonky car: arcs must be clear for radii 25% tighter or wider
    steer_hold: 0.5                # s between steering changes
    reverse_allowed: true          # the car reverses (checked): needed in the small arena
    slow_linear: 0.3               # 0.1 < x <= 0.6 = slow (W3 manual)
    lock_angular: 0.15             # inside the manual's left/right bands (+-0.2 is NOT left)
    allow_fast: false
    clearance: 0.30
    goal_tolerance: 0.2            # the exit zone is only 1.5 m: drive right to its centre
    escape_clearance: 0.2          # boxed in: arcs this close to things are allowed to get out
    lookahead: 1.2
    use_fence: true
    fence_margin: 0.0              # the walls themselves (the camera sees them too)
    zone_keep_out: true            # never drive into another corner zone while searching (a car fully
                                   # inside a zone it treats as the exit ends the run)
    horizon: 2.2                   # small arena: arcs checked 2.2 m ahead (3.0 in the 20 m arena)
    watchdog: 0.5

localizer:
  ros__parameters:
    raw_odom_topic: "/zed/zed_node/odom"
    raw_odom_frame: "odom"
    map_frame: "sar_map"
    scan_frame: "zed_left_camera_frame"
    n_particles: 300
    sigma_hit: 0.12             # m: how close a scan point must be to a mapped obstacle to count
    z_hit: 0.75                 # the rest is 'unexplained' (cards, moved pieces): rebuilt course
    max_step: 0.04              # m of correction per update (never looks like a jump)
    min_explained: 0.35         # hold the correction if less of the scan matches the map

map_diff:
  ros__parameters:
    tol: 0.45                   # m from anything mapped before something counts as new (rebuilt course)
    min_length: 0.1             # card-sized blobs only
    max_length: 0.75
    max_width: 0.35
    min_hits: 3                 # seen in 3 updates (1 s apart) before it's reported

mission_manager:
  ros__parameters:
    exit_rule: "stars"          # "stars": nearest exit matching a star on a SAFE card; "sign": old rule
    route_clearance: 0.8        # known-map mode: route points kept this far from mapped obstacles
    max_gap_viewpoints: 6
    route_mode: "auto"          # auto: laps in the 10 x 7 m arena ("loops"), lanes + ring in a big one
    lap_pattern: ["ring", "figure8"]   # laps after the first ring: they alternate the viewing directions
    ring_inset: 1.5             # the ring runs 1.5 m from the walls; its ends are 2 m radius half circles
    ring_corner: 2.0
    figure8_radius: 2.0
    n_lanes: 3                  # big arena only
    gate_layout: "corners"      # the four 1.5 x 1.5 m corner zones
    gate_colours: ["red", "blue", "green", "yellow"]   # MEASURE: zone colours in order SW, SE, NE, NW
    start_on: "motion"          # clock starts when the car first moves (scoring sheet 3.1)
    # timers, seconds from the first move (Tmax = 600 s; full time points up to 300 s)
    lanes_end: 120.0            # first lap
    ring_end: 450.0             # search ends (7:30) unless all 12 cards are in earlier
    forced_exit: 500.0          # leave whatever is happening
    estop: 590.0                # stop the car (it must be in the exit zone by 600 s)
    exit_via_route: true        # leave along the ring and drive into the zone along its wall
    exit_approach_dist: 2.0
    gate_tolerance: 0.3         # "in the zone": within 0.3 m of its centre (the whole car must be inside)
    gate_half_size: 0.45
    mat_max_offset: 0.5         # ignore a floor-colour sighting this far from the zone's known corner
    geofence_margin: 0.6
    mopup_visits: true          # after the laps: drive to cards seen but not read
    turn_back_on_block: true    # leaving: the way to the exit blocked for wp_block_time -> go round the other way
    expected_cards: 12          # cards on the course: leave early only when all are confirmed (0 = unknown)
    good_conf: 0.8              # confirmed cards below this get one more look, if time allows
    route_inspect: "none"       # small arena: read cards from the laps, no stops ("cheap" / "always" = big arena)
    cheap_dist: 3.0
    revisit_dwell: 3.0          # seconds of looking at a revisit before creeping closer
    creep: 0.5                  # the one fine correction: this much closer (m)
    visit_extra: 15.0           # a revisit may take its travel time + this
    mopup_margin: 25.0          # no new revisits this close to ring_end

target_tracker:
  ros__parameters:
    use_depth: true
    depth_topic: "/zed/zed_node/depth/depth_registered"
    camera_info_topic: "/zed/zed_node/depth/camera_info"
    use_zed_objects: false      # true = ZED person detection as a backup position source
    csv_path: "~/sar_run/tracks.csv"      # every track, for debugging
    # ---- what the judges read (scoring sheet 3.4 and 3.6) ----
    answer_file: "~/sar_run/answer.csv"   # x,y,class - at most 12 lines, best first, cleared at start
    answer_header: true
    answer_frame: "start"       # TA question: "start" = origin where the car starts, x = its heading;
                                # "zone" = the start zone's outer corner, axes along the walls;
                                # "arena" = SW corner; "custom" = answer_origin [x, y, yaw_deg] (arena frame)
    answer_origin: [0.0, 0.0, 0.0]
    run_dir: "~/sar_run"        # semantic map for the mapping bonus: map.pgm/.yaml, map_targets.json,
                                # map_semantic.png, saved every map_period s and at the end
    map_period: 10.0
    map_topic: "/sar/grid"      # the grid built during the run ("/map" if RTAB-Map runs during the run)
    accept_conf: 0.7            # a card counts as confirmed from here (and >= min_class_obs readings)
    min_class_obs: 3
    expected_cards: 12          # same as mission_manager: duplicates are merged above this count
    good_conf: 0.8              # same as mission_manager: below this a confirmed card is rechecked once
    recheck: true

exit_detector:
  ros__parameters:
    use_camera: true
    rgb_topic: "/zed/zed_node/rgb/image_rect_color"
    sign_from_blobs: true       # until YOLO knows the exit sign
    s_min: 115                  # calibrate on site (lock ZED white balance + exposure first)
    v_min: 60
    publish_debug: false

board_detector:
  ros__parameters:
    rgb_topic: "/zed/zed_node/rgb/image_rect_color"
    use_matcher: true           # reference-photo matching
    use_recognizer: true        # core/card_recognizer.py (templates, works to ~50 px); false = ORB only
    card_refs: ""               # "" = the package's cards/ folder; or your own folder of card photos
    match_min_px: 40            # card box height before matching is tried
    min_score: 0.60             # template fit needed to accept a card (raise if you see wrong classes)
    matcher_full_frame: true    # no YOLO model yet: the recognizer searches whole frames
    matcher_rate: 2.0
    look_at_targets: true       # also classify known-but-unconfirmed cards projected into the image
    look_rate: 2.0
    look_max: 2                 # regions searched per frame and per source (each ~0.1-0.3 s on the Jetson CPU)
    depth_proposals: true       # search where the depth image shows something standing on the floor
    depth_topic: "/zed/zed_node/depth/depth_registered"
    depth_info_topic: "/zed/zed_node/depth/camera_info"
    card_height: 0.42           # MEASURE: card board height (m)
    camera_height: 0.25         # MEASURE: lens centre above the floor (same as depth_scan)
    rgb_info_topic: "/zed/zed_node/rgb/camera_info"
    model_path: "~/sar_models/detector.onnx"
    classifier_path: "~/sar_models/classifier.onnx"
    class_names: ["card", "star", "cone", "box"]
    imgsz: 1280
    conf_threshold: 0.35
    classify_min_px: 70
    max_rate: 8.0
